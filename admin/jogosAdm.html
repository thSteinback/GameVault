<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="js/guard.js"></script>
  <script src="js/api.js"></script> 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameVault — Controle de Jogos</title>
  <link rel="stylesheet" href="../style.css">
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
  <style>
    nav.menu ul { list-style: none; display: flex; gap: 18px; margin: 0; padding: 0; }
    nav.menu ul li a {
      color: #ccc; text-decoration: none;
      font-family: 'Jersey 10', sans-serif; font-size: 17px;
      padding: 6px 16px; border-radius: 30px; border: 1px solid transparent;
      transition: all 0.2s;
    }
    nav.menu ul li a:hover { color: #fff; border-color: rgba(255,255,255,0.3); }
    nav.menu ul li a.active { background: #fff; color: #301F8F; border-color: #fff; }

    .admin-wrapper { max-width: 1100px; margin: 40px auto 80px; padding: 0 30px; }
    .page-title { font-size: 30px; margin: 0 0 30px; color: #fff; }

    /* Formulário */
    .form-card {
      background: linear-gradient(135deg, rgba(48,31,143,0.45), rgba(0,0,0,0.5));
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 28px 30px;
      margin-bottom: 30px;
    }
    .form-card h3 { margin: 0 0 22px; font-size: 20px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    @media (max-width: 640px) { .form-row { grid-template-columns: 1fr; } }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 14px; color: #aaa; }
    .form-group input,
    .form-group textarea,
    .form-group select {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px; color: #fff;
      font-family: 'Jersey 10', sans-serif; font-size: 16px;
      padding: 10px 14px; outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus,
    .form-group textarea:focus { border-color: #8C8CFF; }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .form-group input[type="file"] { padding: 8px; color: #aaa; }
    .form-actions { text-align: right; margin-top: 10px; }

    /* Preview de imagem */
    #previewImg {
      display: none;
      width: 70px; height: 95px; object-fit: cover;
      border-radius: 8px; margin-top: 8px;
      border: 1px solid rgba(255,255,255,0.15);
    }

    /* Tabela */
    .panel {
      background: linear-gradient(135deg, rgba(48,31,143,0.4), rgba(0,0,0,0.5));
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px; overflow: hidden;
    }
    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 22px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .panel-header h3 { margin: 0; font-size: 18px; }

    .search-bar input {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 30px; color: #fff;
      font-family: 'Jersey 10', sans-serif; font-size: 15px;
      padding: 6px 18px; outline: none; width: 200px;
      transition: border-color 0.2s;
    }
    .search-bar input:focus { border-color: #8C8CFF; }

    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    thead th {
      background: rgba(0,0,0,0.3); padding: 10px 16px;
      text-align: left; color: #999;
      font-family: 'Jersey 10', sans-serif; font-size: 14px; font-weight: normal;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.2s; }
    tbody tr:hover { background: rgba(255,255,255,0.04); }
    tbody td { padding: 11px 16px; color: #ddd; vertical-align: middle; }

    .badge {
      display: inline-block; padding: 3px 12px;
      border-radius: 20px; font-size: 13px;
    }
    .badge-ativo { background: rgba(0,200,120,0.15); color: #00c878; border: 1px solid #00c87835; }

    .mini-img {
      width: 38px; height: 52px; object-fit: cover;
      border-radius: 6px; background: #333;
      vertical-align: middle;
    }
    .empty-state { text-align: center; color: #555; padding: 40px; font-size: 16px; }

    /* Botões */
    .btn-primary {
      background: #fff; color: #301F8F; border: none;
      border-radius: 30px; padding: 9px 26px;
      font-family: 'Jersey 10', sans-serif; font-size: 17px;
      cursor: pointer; transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.85; }
    .btn-acao {
      background: transparent; border: 1px solid rgba(255,255,255,0.2);
      color: #ccc; border-radius: 8px; padding: 5px 12px;
      font-family: 'Jersey 10', sans-serif; font-size: 14px;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-acao:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .btn-acao.danger { border-color: rgba(255,80,80,0.4); color: #ff8080; }
    .btn-acao.danger:hover { background: rgba(255,80,80,0.15); }

    /* Modal confirmação */
    .confirm-modal {
      display: none; position: fixed; z-index: 2000; inset: 0;
      background: rgba(0,0,0,0.75);
    }
    .confirm-modal.open { display: flex; align-items: center; justify-content: center; }
    .confirm-box {
      background: linear-gradient(to bottom, #402f8f, #1c1c1c);
      border-radius: 16px; padding: 32px 38px;
      text-align: center; max-width: 340px; width: 90%;
      animation: fadeSlide 0.3s ease forwards;
    }
    .confirm-box p { font-size: 18px; margin: 0 0 24px; }

    /* Toast */
    #toast {
      position: fixed; bottom: 28px; right: 28px;
      background: #301F8F; color: #fff;
      padding: 12px 24px; border-radius: 12px; font-size: 16px;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      opacity: 0; transform: translateY(16px);
      transition: all 0.3s; pointer-events: none; z-index: 9999;
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    /* Contagem */
    .count-badge {
      background: rgba(255,255,255,0.1);
      color: #ccc; font-size: 14px;
      padding: 2px 10px; border-radius: 20px;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;">
      <a href="../index.html">
        <img src="../imagens/logoGV.png" alt="Logo GameVault" class="logo">
      </a>
      <h1>GameVault</h1>
    </div>
    <nav class="menu">
      <ul>
        <li><a href="jogosAdm.html" class="active">Controle de Jogos</a></li>
        <li><a href="controlUsu.html">Controle de Usuários</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="../perfilp.html">Perfil</a></li>
        <li><a href="#" id="btnSair">Sair</a></li>
      </ul>
    </nav>
  </header>

  <div class="admin-wrapper">
    <h2 class="page-title">🎮 Controle de Jogos</h2>

    <!-- Formulário de cadastro -->
    <div class="form-card">
      <h3>➕ Cadastrar novo jogo</h3>
      <div class="form-row">
        <div class="form-group">
          <label>Nome do jogo *</label>
          <input type="text" id="jogoNome" placeholder="Ex: The Last of Us Part II">
        </div>
        <div class="form-group">
          <label>Ano de lançamento</label>
          <input type="number" id="jogoAno" placeholder="Ex: 2020" min="1970" max="2099">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Categoria</label>
          <input type="text" id="jogoCategoria" placeholder="Ex: Ação, RPG, Aventura">
        </div>
        <div class="form-group">
          <label>Imagem de capa</label>
          <input type="file" id="jogoImagem" accept="image/*">
          <img id="previewImg" alt="Preview">
        </div>
      </div>
      <div class="form-group" style="margin-bottom:16px;">
        <label>Descrição</label>
        <textarea id="jogoDesc" placeholder="Sinopse ou descrição do jogo..."></textarea>
      </div>
      <div class="form-actions">
        <button class="btn-primary" onclick="cadastrarJogo()">Cadastrar jogo</button>
      </div>
    </div>

    <!-- Tabela -->
    <div class="panel">
      <div class="panel-header">
        <h3>Jogos cadastrados <span class="count-badge" id="jogoCount">0</span></h3>
        <div class="search-bar">
          <input type="text" id="buscaJogo" placeholder="🔍 Buscar jogo..." oninput="filtrar(this.value)">
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>Capa</th>
            <th>Nome</th>
            <th>Descrição</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tbodyJogos">
          <tr><td colspan="5" class="empty-state">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal confirmação -->
  <div id="confirmModal" class="confirm-modal">
    <div class="confirm-box">
      <p id="confirmTexto">Confirmar exclusão?</p>
      <button class="btn-acao danger" onclick="confirmar()">🗑 Excluir</button>
      &nbsp;
      <button class="btn-acao" onclick="fecharConfirm()">Cancelar</button>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const BASE = 'http://localhost:3000';
    let pendingId = null;
    let todosJogos = [];

    /* ── Proteção ── */
    const usuario = localStorage.getItem('usuarioLogado');
    if (!usuario || localStorage.getItem('isAdmin') !== 'true') {
      alert('Acesso restrito!');
      window.location.href = '../index.html';
    }

    document.getElementById('btnSair').onclick = (e) => {
      e.preventDefault();
      localStorage.removeItem('usuarioLogado');
      localStorage.removeItem('isAdmin');
      window.location.href = '../index.html';
    };

    /* ── Preview de imagem ── */
    document.getElementById('jogoImagem').addEventListener('change', function () {
      const file = this.files[0];
      const prev = document.getElementById('previewImg');
      if (file) {
        prev.src = URL.createObjectURL(file);
        prev.style.display = 'block';
      } else {
        prev.style.display = 'none';
      }
    });

    /* ── Toast ── */
    function toast(msg, dur = 2800) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), dur);
    }

    /* ── Filtro ── */
    function filtrar(termo) {
      const rows = document.querySelectorAll('#tbodyJogos tr');
      rows.forEach(tr => {
        tr.style.display = tr.textContent.toLowerCase().includes(termo.toLowerCase()) ? '' : 'none';
      });
    }

    /* ── Carregar jogos ── */
    async function carregarJogos() {
      const tbody = document.getElementById('tbodyJogos');
      try {
        todosJogos = await adminFetch(`${BASE}/admin/jogos`).then(r => r.json());
        document.getElementById('jogoCount').textContent = todosJogos.length;

        tbody.innerHTML = todosJogos.length ? todosJogos.map(j => `
          <tr>
            <td><img class="mini-img" src="${j.JOG_IMG ? BASE+'/uploads/'+j.JOG_IMG : '../imagens/sem-capa.png'}" alt=""></td>
            <td style="font-weight:500;">${j.JOG_NOME}</td>
            <td style="max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#aaa;">
              ${j.JOG_DESC || '—'}
            </td>
            <td><span class="badge badge-ativo">Ativo</span></td>
            <td>
              <button class="btn-acao danger" onclick="abrirConfirm(${j.JOG_COD}, '${j.JOG_NOME.replace(/'/g,"\\'")}')">
                🗑 Excluir
              </button>
            </td>
          </tr>`).join('')
        : '<tr><td colspan="5" class="empty-state">Nenhum jogo cadastrado ainda.</td></tr>';
      } catch {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-state">❌ Erro ao carregar jogos.</td></tr>';
      }
    }

    /* ── Cadastrar ── */
    async function cadastrarJogo() {
      const nome = document.getElementById('jogoNome').value.trim();
      const desc = document.getElementById('jogoDesc').value.trim();
      if (!nome) { toast('⚠️ Informe o nome do jogo!'); return; }

      const fd = new FormData();
      fd.append('nome', nome);
      fd.append('desc', desc);
      const img = document.getElementById('jogoImagem').files[0];
      if (img) fd.append('imagem', img);

      try {
        const r = await adminFetch(`${BASE}/admin/jogos`, { method: 'POST', body: fd });
        const data = await r.json();
        if (r.ok) {
          toast('✅ Jogo cadastrado com sucesso!');
          document.getElementById('jogoNome').value = '';
          document.getElementById('jogoDesc').value = '';
          document.getElementById('jogoAno').value = '';
          document.getElementById('jogoCategoria').value = '';
          document.getElementById('jogoImagem').value = '';
          document.getElementById('previewImg').style.display = 'none';
          carregarJogos();
        } else {
          toast('❌ ' + (data.erro || 'Erro ao cadastrar.'));
        }
      } catch { toast('❌ Erro de conexão!'); }
    }

    /* ── Confirmar exclusão ── */
    function abrirConfirm(id, nome) {
      pendingId = id;
      document.getElementById('confirmTexto').textContent = `Excluir "${nome}"?`;
      document.getElementById('confirmModal').classList.add('open');
    }
    function fecharConfirm() {
      pendingId = null;
      document.getElementById('confirmModal').classList.remove('open');
    }
    async function confirmar() {
      if (!pendingId) return;
      const id = pendingId;        // captura ANTES de fechar (fecharConfirm zera o pendingId)
      fecharConfirm();
      try {
        const r = await adminFetch(`${BASE}/admin/jogos/${id}`, { method: 'DELETE' });
        if (r.ok) { toast('✅ Jogo excluído!'); carregarJogos(); }
        else toast('❌ Erro ao excluir.');
      } catch { toast('❌ Erro de conexão!'); }
    }

    document.getElementById('confirmModal').addEventListener('click', function(e) {
      if (e.target === this) fecharConfirm();
    });

    carregarJogos();
  </script>
</body>
</html>
