# Sobe o GameVault completo (app + banco) com um comando: docker compose up
services:
  db:
    image: mariadb:10.6
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: gamevault
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      # Coloque seu schema .sql em ./db — ele é executado na 1ª subida do banco
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: root
      DB_NAME: gamevault
      JWT_SECRET: troque-este-segredo-em-producao
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads

volumes:
  dbdata:
  uploads:
